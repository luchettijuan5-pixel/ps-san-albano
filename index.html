<body>
<script src="datos.js"></script>
<style>
/* Layout: barra superior fija azul + vistas tipo "match centre"; las franjas de la camiseta (amarillo, celeste, azul) son el único ornamento. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#E8EEF6; --ink:#0A1F3D; --muted:#55667E; --line:#D3DCE8;
  --navy:#0B2A55; --navy-deep:#071C3A; --sky:#5BB3E6; --sky-ink:#0F6CAB; --gold:#F5C400; --on-gold:#0A1F3D;
  --hd-fg:#FFFFFF; --hd-muted:#A9C0DD;
  --win:#1B8553; --loss:#C23B2A; --draw:#6B7890; --hl:#FFF6CC;
  --f-display:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --f-body:Arial,"Helvetica Neue",Helvetica,"Liberation Sans",sans-serif;
  --r:3px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#061224; --surface:#0C1F38; --surface2:#122B4A; --ink:#EAF1FA; --muted:#9BAFC8; --line:#1F3A5C;
  --navy:#0E3266; --navy-deep:#04101F; --sky:#6CC0F0; --sky-ink:#7CC8F4; --gold:#FFD21F; --on-gold:#0A1F3D;
  --win:#4CC38A; --loss:#F27A66; --draw:#9BAFC8; --hl:#3A3410; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#061224; --surface:#0C1F38; --surface2:#122B4A; --ink:#EAF1FA; --muted:#9BAFC8; --line:#1F3A5C;
  --navy:#0E3266; --navy-deep:#04101F; --sky:#6CC0F0; --sky-ink:#7CC8F4; --gold:#FFD21F; --on-gold:#0A1F3D;
  --win:#4CC38A; --loss:#F27A66; --draw:#9BAFC8; --hl:#3A3410; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.01em}
h2{font-size:2.1rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:700}
.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy-deep);color:var(--hd-fg)}
.top-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:8px 0}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.01em;line-height:1.05}
.brand small{display:block;color:var(--gold);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav a{font-family:var(--f-display);text-transform:uppercase;font-weight:700;font-size:.9rem;letter-spacing:.1em;text-decoration:none;color:var(--hd-muted);padding:16px 12px 13px;border-bottom:3px solid transparent;white-space:nowrap}
nav a:hover{color:var(--hd-fg)}
nav a[aria-current="page"]{color:var(--hd-fg);border-bottom-color:var(--gold)}
.demo-sw{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--hd-muted);cursor:pointer;white-space:nowrap}
.demo-sw input{accent-color:var(--gold);width:16px;height:16px}
.hoops{height:6px;background:linear-gradient(to bottom,var(--gold) 0 33.3%,var(--sky) 33.3% 66.6%,var(--navy) 66.6%)}
@media (max-width:760px){ .top-in{gap:0 12px} nav{order:3;flex-basis:100%;margin:0 -16px;padding:0 8px} nav a{padding:9px 9px 7px;font-size:.95rem} .demo-sw{margin-left:auto} }

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 60px;display:flex;flex-direction:column;gap:22px}
.view{display:flex;flex-direction:column;gap:26px;animation:in .25s ease-out}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g4,.g3,.g2{grid-template-columns:minmax(0,1fr)}}
.note{background:var(--surface2);border-radius:var(--r);padding:10px 14px;font-size:.88rem;color:var(--muted)}
.note b{color:var(--ink)}
.tag{display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);vertical-align:middle;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.next{background:var(--gold);color:var(--on-gold)}
.res{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:700 .8rem var(--f-display);color:var(--surface)}
.res.G{background:var(--win)}.res.P{background:var(--loss)}.res.E{background:var(--draw)}.res.X{background:var(--surface2);color:var(--muted)}
.lv{font:700 .72rem var(--f-display);letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.crest{flex:none;width:34px;height:34px;object-fit:contain}.crest.lg{width:58px;height:58px}.crest.sm{width:22px;height:22px}
.badge{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);font:700 .8rem var(--f-display);color:var(--muted)}
.badge.sa{background:linear-gradient(to bottom,var(--gold) 0 33.3%,var(--sky) 33.3% 66.6%,var(--navy) 66.6%);border-color:var(--navy);color:transparent}
.btn{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:.82rem!important;text-decoration:none;background:var(--gold);color:var(--on-gold);padding:8px 16px;border-radius:6px;border:0;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.empty{color:var(--muted);font-style:italic}

/* hero */
.hero{color:var(--hd-fg);border-radius:var(--r);overflow:hidden;background-color:var(--navy-deep);background-size:cover;background-position:center 60%;min-height:400px;display:flex}
.hero-txt{padding:36px;display:flex;flex-direction:column;gap:14px;justify-content:flex-end;width:100%;background:linear-gradient(90deg,rgba(5,20,42,.93) 0%,rgba(5,20,42,.72) 38%,rgba(5,20,42,.08) 72%)}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:700;line-height:1}
.hero h1 span{display:block;color:var(--gold);font-size:.36em;letter-spacing:.2em;font-weight:700;margin-top:10px;text-transform:uppercase}
.hero p{margin:0;color:#DCE6F3;max-width:44ch}
.hero-id{display:flex;gap:18px;align-items:center}
@media (max-width:620px){.hero{min-height:320px}.hero-txt{padding:20px;background:linear-gradient(0deg,rgba(5,20,42,.95) 0%,rgba(5,20,42,.7) 55%,rgba(5,20,42,.15) 100%)}}
.ban{border-radius:var(--r);overflow:hidden;background-color:var(--navy-deep);background-size:cover;background-position:center;min-height:190px;display:flex;align-items:flex-end;color:var(--hd-fg)}
.ban div{width:100%;padding:44px 28px 20px;background:linear-gradient(0deg,rgba(5,20,42,.92) 0%,rgba(5,20,42,.55) 55%,rgba(5,20,42,0) 100%)}
.ban h2{font-size:2.5rem}.ban h2::after{content:"";display:block;width:64px;height:4px;background:var(--gold);margin-top:8px}
.ban + .view > .head:first-child h2{display:none}
@media (max-width:620px){.ban{min-height:140px}.ban div{padding:30px 16px 14px}.ban h2{font-size:2rem}}
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.welcome p{margin:10px 0 0;max-width:52ch}.welcome .lead{font-size:clamp(1.45rem,3vw,1.9rem);line-height:1.25;font-weight:700;text-wrap:balance}
.rows{list-style:none;margin:6px 0 0;padding:0}
.rows a{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:14px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.rows b{font-size:1.3rem}.rows span{color:var(--muted)}.rows i{font-style:normal;color:var(--sky-ink);transition:transform .15s}
.rows a:hover b{color:var(--sky-ink)}.rows a:hover i{transform:translateX(4px)}
.home .hist{margin-top:14px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.gal img{aspect-ratio:3/2;object-fit:cover}
.week{margin:0;padding-top:16px;border-top:1px solid var(--line);color:var(--muted)}.week .lbl{margin-right:8px}.week a{color:var(--sky-ink)}
.home .hero{min-height:460px}.home .hero-txt{background:linear-gradient(0deg,rgba(5,20,42,.9) 0%,rgba(5,20,42,.45) 45%,rgba(5,20,42,0) 75%)}
@media (max-width:700px){.welcome{grid-template-columns:minmax(0,1fr);gap:20px}.rows a{grid-template-columns:minmax(0,1fr) auto}.rows span{grid-column:1/-1;grid-row:2}.gal{grid-template-columns:minmax(0,1fr)}.home .hero{min-height:340px}}
.xvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px;margin-top:10px}
.xvs h4{margin:0 0 6px;font-size:1.35rem;border-bottom:3px solid var(--gold);padding-bottom:6px}.xvs h4 a{text-decoration:none}
.xvs ol{list-style:none;margin:0;padding:0}.xvs li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;padding:5px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.xvs li span{color:var(--sky-ink);font-weight:700;text-align:right}.xvs a{text-decoration:none}.xvs li a:hover{text-decoration:underline}
.lead2{font-size:1.5rem;font-weight:700;line-height:1.25;margin:14px 0 0;text-wrap:balance}
@media (max-width:900px){.xvs{grid-template-columns:repeat(2,minmax(0,1fr))}} @media (max-width:520px){.xvs{grid-template-columns:minmax(0,1fr)}}
.figs{display:flex;flex-wrap:wrap;border-block:1px solid var(--line);margin-top:10px}
.figs>div{flex:1 1 150px;padding:14px 16px 14px 0;min-width:0;display:flex;flex-direction:column;gap:2px}
.figs .num{font-size:2.1rem;line-height:1.1}.figs.txt .num{font-size:1.3rem}.figs .empty{font-size:1rem;font-weight:400}
.vd{font-weight:700}.vd.G{color:var(--win)}.vd.P{color:var(--loss)}.vd.E{color:var(--draw)}
.pms{list-style:none;margin:6px 0 0;padding:0}
.pms a{display:grid;grid-template-columns:22px 70px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:10px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.pms a:hover .t b{color:var(--sky-ink)}.pms .num{font-size:1.15rem}.pms .t{display:flex;flex-direction:column;min-width:0}.pms small{color:var(--muted)}.pms .pt{color:var(--sky-ink);font-weight:700;white-space:nowrap}
.pms .vd{font-size:1.15rem}
.vts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 44px}@media (max-width:800px){.vts{grid-template-columns:minmax(0,1fr)}}
.vt ul{list-style:none;margin:0;padding:0}
.vt li{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(40px,1fr) 46px auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.vt .nm{overflow-wrap:anywhere}.vt .nm a{text-decoration:none}.vt .bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}.vt .bar i{display:block;height:100%;background:var(--sky);transition:width .4s}
.vt li.gana .bar i{background:var(--gold)}.vt li.gana .nm{font-weight:700}.vt li.mine .nm::after{content:" ✓";color:var(--win)}
.vt b{text-align:right}.vt .chip{padding:2px 10px;font-size:.72rem}
.fmn{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:40px;align-items:start}
.pitch{position:relative;aspect-ratio:10/13;border-radius:var(--r);background:repeating-linear-gradient(0deg,#2E7D46 0 10%,#2A7340 10% 20%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.pitch::before{content:"";position:absolute;left:0;right:0;top:38%;border-top:2px solid rgba(255,255,255,.55)}
.pitch::after{content:"";position:absolute;left:0;right:0;top:60%;border-top:2px dashed rgba(255,255,255,.4)}
.cam{position:absolute;transform:translate(-50%,-50%);z-index:1;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-display);width:74px}
.cam b{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:1.25rem;color:#fff;text-shadow:0 1px 3px #000,0 0 2px #000;background:linear-gradient(to bottom,#F5C400 0 33.3%,#5BB3E6 33.3% 66.6%,#0B2A55 66.6%);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4);transition:transform .15s}
.cam b.ft{position:relative;background:#E9F0F8}.cam b.ft img{position:absolute;inset:0;width:100%;height:100%;max-width:none;border-radius:50%;object-fit:cover;object-position:50% 6%;display:block}
.cam b.ft i{position:absolute;right:-7px;bottom:-5px;min-width:18px;height:18px;padding:0 3px;border-radius:9px;background:#0B2A55;border:1.5px solid #fff;color:#fff;font:700 .68rem/15px var(--f-display);text-shadow:none;text-align:center;box-sizing:border-box}
.cam span{font-size:.72rem;line-height:1.05;color:#fff;text-shadow:0 1px 2px #000;text-align:center;overflow-wrap:anywhere;font-weight:700}
.cam:hover b{transform:scale(1.1)}.cam[aria-pressed="true"] b{border-color:#F5C400;box-shadow:0 0 0 4px #F5C400,0 2px 6px rgba(0,0,0,.5);transform:scale(1.12)}
.cam:focus-visible{outline:none}.cam:focus-visible b{box-shadow:0 0 0 4px #fff}
.fmh{display:flex;align-items:center;gap:14px;font-size:1.9rem;text-transform:none;letter-spacing:0;margin-top:2px}
.fmh b{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--hd-fg);border:3px solid var(--gold);font-size:1.5rem}
.fmt{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);min-width:0}
@media (max-width:820px){.fmn{grid-template-columns:minmax(0,1fr);gap:22px}.fmt{position:static}.pitch{max-width:440px;width:100%;margin:0 auto}}
@media (max-width:420px){.cam{width:60px}.cam b{width:38px;height:38px;font-size:1.1rem}.cam span{font-size:.64rem}}
.live{display:flex;align-items:center;justify-content:space-between;gap:16px 28px;flex-wrap:wrap;background:var(--navy-deep);color:var(--hd-fg);border-radius:14px;padding:16px 22px;border-left:6px solid var(--gold)}
.live .lbl{color:var(--gold)}.lv-t{display:flex;flex-direction:column;gap:3px;min-width:0}.lv-t>b{font-size:1.35rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lv-t i{font-style:normal;color:var(--gold);font-weight:400}.lv-t>span:last-child{color:var(--hd-muted);font-size:.92rem}
.yt{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--hd-fg);padding:8px 16px 8px 8px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .15s}
.yt:hover{background:rgba(255,255,255,.2)}.yt span{display:flex;flex-direction:column;line-height:1.2}.yt small{color:var(--hd-muted)}
.play{flex:none;width:46px;height:46px;border-radius:50%;background:#D62B1F;display:grid!important;place-items:center}.play::after{content:"";border-left:15px solid #fff;border-block:9px solid transparent;margin-left:4px}
.live.on .play{box-shadow:0 0 0 0 rgba(214,43,31,.7);animation:pulso 2s infinite}@keyframes pulso{70%{box-shadow:0 0 0 12px rgba(214,43,31,0)}100%{box-shadow:0 0 0 0 rgba(214,43,31,0)}}
@media (prefers-reduced-motion:reduce){.live.on .play{animation:none}}
.envivo{display:block;text-decoration:none;color:#fff;border-radius:14px;overflow:hidden;background-color:var(--navy-deep);background-size:cover;background-position:center;border:3px solid var(--gold)}
.ev-in{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:22px;padding:22px 16px;min-height:340px;background:rgba(5,20,42,.82);transition:background .2s}
.envivo:hover .ev-in{background:rgba(5,20,42,.7)}
.ev-badge{display:inline-flex;align-items:center;gap:8px;background:#D62B1F;color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:5px 14px;border-radius:99px}
.ev-badge i{width:9px;height:9px;border-radius:50%;background:#fff;animation:parp 1.2s infinite}@keyframes parp{50%{opacity:.25}}
.ev-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;width:100%;max-width:760px}
.ev-teams>span:not(.play){display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-weight:700;font-size:clamp(1.05rem,3.4vw,1.7rem);line-height:1.1;overflow-wrap:anywhere}
.ev-teams .crest.lg{width:84px;height:84px}
.play.big{width:92px;height:92px;box-shadow:0 0 0 0 rgba(214,43,31,.7);animation:pulso 2s infinite}.play.big::after{border-left-width:30px;border-block-width:18px;margin-left:8px}
.ev-foot{color:#DCE6F3;font-size:.95rem;text-align:center}
@media (max-width:520px){.ev-in{min-height:260px}.ev-teams .crest.lg{width:58px;height:58px}.play.big{width:66px;height:66px}.play.big::after{border-left-width:22px;border-block-width:13px;margin-left:6px}}
@media (prefers-reduced-motion:reduce){.play.big,.ev-badge i{animation:none}}
.envivo.off{border:1px solid var(--line);border-radius:10px;max-width:640px;background-image:none!important;background-color:var(--surface2);color:var(--ink)}
.envivo.off .ev-in{min-height:0;background:none;flex-direction:row;flex-wrap:wrap;justify-content:flex-start;align-items:center;gap:8px 14px;padding:10px 14px}
.envivo.off:hover .ev-in{background:none}.envivo.off:hover{border-color:var(--muted)}
.envivo.off .ev-badge{background:none;color:var(--muted);padding:0;font-size:.7rem;order:2;flex-basis:100%}.envivo.off .ev-badge i{display:none}
.envivo.off .ev-teams{display:flex;width:auto;max-width:none;gap:10px;order:1}
.envivo.off .ev-teams>span:not(.play),.envivo.off a.rv{display:flex;align-items:center;flex-direction:row;gap:6px;font-size:1rem;font-weight:700;color:var(--ink)}
.envivo.off a.rv{text-decoration:underline;text-decoration-color:var(--gold);text-decoration-thickness:2px;text-underline-offset:3px}.envivo.off a.rv:hover{color:var(--sky-ink)}.envivo.off a.rv.in{display:inline;font-size:inherit;color:inherit}
.envivo.off .crest.lg{width:24px;height:24px;filter:grayscale(1) opacity(.8)}
.envivo.off .play.big{order:-1;width:34px;height:34px;background:#8A94A1;animation:none;box-shadow:none}.envivo.off .play.big::after{border-left-width:11px;border-block-width:7px;margin-left:3px}

/* Estadísticas derivadas: una pasada sobre participaciones + eventos */
function calc(f={}){
  const R=new Map(), ok=new Set();
  const row=id=>{if(!R.has(id))R.set(id,{id,j:J(id),pj:0,tit:0,ban:0,min:0,vic:0,try:0,conv:0,pen:0,drop:0,ama:0,roja:0,eqs:{},fe:new Set(),ms:[]});return R.get(id)};
  for(const p of parts()){ const m=M[p.m];
    if(p.rol==='N')continue; if(f.eq&&m.eq!==f.eq)continue; if(f.desde&&m.dia<f.desde)continue; if(f.hasta&&m.dia>f.hasta)continue; if(f.cond&&p.rol!==f.cond)continue;
    const r=row(p.j); r.pj++; if(p.rol==='T')r.tit++; if(p.rol==='S')r.ban++; r.min+=p.min||0; if(m.sa!=null&&m.sa>m.ri)r.vic++;
    r.eqs[m.eq]=(r.eqs[m.eq]||0)+1; r.fe.add(m.fecha); r.ms.push({m,p}); ok.add(p.m+'|'+p.j);
  }
  for(const e of eventos()) if(ok.has(e.m+'|'+e.j)) R.get(e.j)[e.t]++;
  let out=[...R.values()];
  for(const r of out){ r.pts=5*r.try+2*r.conv+3*r.pen+3*r.drop;
    r.ptit=r.pj?Math.round(100*r.tit/r.pj):0; r.ppp=r.pj?r.pts/r.pj:0; r.tpp=r.pj?r.try/r.pj:0;
    let best=0,c=0,prev=-9; [...r.fe].sort((a,b)=>a-b).forEach(x=>{c=x===prev+1?c+1:1;best=Math.max(best,c);prev=x}); r.racha=best; }
  if(f.pos)out=out.filter(r=>r.j.pos===f.pos);
  if(f.q){const q=f.q.toLowerCase();out=out.filter(r=>r.j.nombre.toLowerCase().includes(q))}
  return out;
}

  <div class="tw"><table><thead><tr><th>Pos</th><th class="l">Equipo</th><th>Pts</th><th title="Partidos jugados">PJ</th><th>G</th><th>E</th><th>P</th><th title="Puntos a favor">PF</th><th title="Puntos en contra">PC</th><th>Dif</th><th title="Bonus ofensivo">BO</th><th title="Bonus defensivo">BD</th>${eq==='P'?'<th class="l">Zona</th>':''}</tr></thead>

  <div class="grid g2">
    <div class="card"><h3>Puntuación</h3><dl class="dl"><dt>Victoria</dt><dd>4 puntos</dd><dt>Empate</dt><dd>2 puntos</dd><dt>Bonus ofensivo</dt><dd>+1 por 3 tries más que el rival</dd><dt>Bonus defensivo</dt><dd>+1 por perder por 7 o menos</dd></dl></div>

function vFixture(){
  const nx=proximo(S.fxEq); let list=PARTIDOS.filter(m=>m.eq===S.fxEq);
  if(S.fxSt==='J')list=list.filter(jugado); if(S.fxSt==='P')list=list.filter(m=>!jugado(m));
  let mes=-1,html='';
  for(const m of list){ if(m.date.getMonth()!==mes){mes=m.date.getMonth();html+=`<div class="month">${MES[mes]}</div>`} html+=fxRow(m,nx&&m.id===nx.id) }
  const chip=(k,v,l)=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${S[k]===v}">${l}</button>`;
  return `<section class="view"><div class="head"><div><h2>Partidos</h2><p>La temporada ${TEMPORADA.anio} completa, con resultados oficiales de URBA. Elegí el equipo y tocá un partido para ver la formación.</p></div></div>
  <div class="head"><div class="chips" role="group" aria-label="Equipo">${Object.entries(EQUIPOS).map(([k,v])=>chip('fxEq',k,v)).join('')}</div>
  <div class="chips" role="group" aria-label="Estado">${chip('fxSt','','Todos')}${chip('fxSt','J','Jugados')}${chip('fxSt','P','Próximos')}</div></div>
  <div class="fx-list">${html}</div></section>`;
}

function vPartidos(){
  const fechas=FIX.filter(([f])=>jugado(M['P-'+f])).reverse();
  return `<section class="view"><div class="head"><div><h2>Partidos</h2><p>Cada jornada con los cuatro equipos, de la más reciente a la primera.</p></div><a class="btn ghost" href="#partidos">Ver fixture completo</a></div>
  <div class="grid g3">${fechas.map(([f])=>{const p=M['P-'+f];return `<div class="card jor"><h3>F${f} · ${p.loc==='L'?'vs':'en'} ${p.rival}<span class="lbl">${p.date.getDate()}/${p.date.getMonth()+1}</span></h3>
    <ul>${Object.keys(EQUIPOS).map(q=>{const m=M[q+'-'+f];return `<li><a href="#partido-${m.id}"><b>${EQUIPOS[q]}</b><span class="sub">${m.sa==null?'A cargar':''}</span><span class="sc">${m.sa!=null?m.sa+'–'+m.ri:''}<span class="res ${letra(m)}">${letra(m)==='X'?'?':letra(m)}</span></span></a></li>`}).join('')}</ul></div>`}).join('')}</div></section>`;

function vPartido(id){
  const m=M[id]; if(!m)return vFixture();
  const ps=parts().filter(p=>p.m===id), es=eventos().filter(e=>e.m===id), cs=cambios().filter(c=>c.m===id).sort((a,b)=>a.min-b.min);
  const slot=(n,pos)=>{const p=ps.find(x=>x.n===n);return `<li><span class="n">${n}</span><span>${p?pl(p.j):'<span class="empty">A completar</span>'}<br><small>${POS[pos][0]}</small></span><small>${p&&p.rol!=='N'?(p.min!=null?p.min+"'":''):p?'No ingresó':''}</small></li>`};
  const sinPos=ps.filter(p=>p.rol==='?');
  const sc={}; es.forEach(e=>{(sc[e.j]=sc[e.j]||{try:0,conv:0,pen:0,drop:0,ama:0,roja:0})[e.t]++});
  const an=Object.entries(sc).map(([j,v])=>({j,...v,pts:5*v.try+2*v.conv+3*v.pen+3*v.drop})).filter(r=>r.pts>0).sort((a,b)=>b.pts-a.pts);
  const sum=an.reduce((a,r)=>a+r.pts,0), tarj=es.filter(e=>e.t==='ama'||e.t==='roja');
  const home=m.loc==='L', A=home?'San Albano':m.rival, B=home?m.rival:'San Albano';
  const big=m.sa!=null?(home?`${m.sa} – ${m.ri}`:`${m.ri} – ${m.sa}`):jugado(m)?'– : –':(m.hora||'vs');
  const enP=id=>ps.some(p=>p.j===id&&p.rol!=='N'), cap=[enP(TEMPORADA.capitan)&&pl(TEMPORADA.capitan),enP(TEMPORADA.subcapitan)&&pl(TEMPORADA.subcapitan)].filter(Boolean).join(' · ')||'<span class="empty">A completar</span>';
  return `<section class="view">
  <div class="head"><a class="btn ghost" href="#partidos">← Partidos</a><div class="chips">${Object.entries(EQUIPOS).map(([k,v])=>`<a class="chip" style="text-decoration:none" href="#partido-${k}-${m.fecha}" aria-pressed="${k===m.eq}">${v}</a>`).join('')}</div></div>
  <div class="score"><div class="score-in">
    <div class="tm">${crest(home?SA:m.rid,'lg')}${A}</div>
    <div class="big">${big}<small>${m.sa!=null?'Final':estado(m)}${m.ht?' · PT '+(home?m.ht[0]+'–'+m.ht[1]:m.ht[1]+'–'+m.ht[0]):''}</small></div>
    <div class="tm">${crest(home?m.rid:SA,'lg')}${B}</div></div>
    <div class="score-meta"><span><b>${EQUIPOS[m.eq]}</b></span><span>Fecha <b>${m.fecha}</b></span><span><b>Sábado ${fd(m)}</b>${m.hora?' · '+m.hora:''}</span><span><b>${home?'Local':'Visitante'}</b>${home?' · Corimayo':''}</span></div></div>

  ${(()=>{const banco=ps.some(p=>p.n>15), ama=tarj.filter(e=>e.t==='ama'), roja=tarj.filter(e=>e.t==='roja'), hayCap=!cap.includes('empty');
   const bonus=m.sa==null?'':[m.bon[0]&&'Ofensivo para San Albano',m.bon[1]&&'Ofensivo para '+m.rival,m.sa<m.ri&&m.ri-m.sa<=7&&'Defensivo para San Albano',m.ri<m.sa&&m.sa-m.ri<=7&&'Defensivo para '+m.rival].filter(Boolean).join(' · ');
   const col2=[
    banco?`<div class="card"><h3>Suplentes</h3><ol class="xv">${BANCO.map((p,i)=>slot(16+i,p)).join('')}</ol></div>`:'',
    sinPos.length?`<div class="card"><h3>También jugaron</h3><p class="sub" style="margin:4px 0 6px">Según la crónica del partido.</p><div class="chips">${sinPos.map(p=>`<span>${pl(p.j)}</span>`).join(' · ')}</div></div>`:'',
    cs.length?`<div class="card"><h3>Cambios</h3><ol class="xv">${cs.map(c=>`<li><span class="n">${c.min}'</span><span>${pl(c.entra)}<br><small>por ${J(c.sale).nombre}</small></span><span></span></li>`).join('')}</ol></div>`:'',
    an.length?`<div class="card"><h3>Puntos de San Albano</h3><div class="tw" style="margin-top:8px"><table><thead><tr><th>Jugador</th><th>Tries</th><th>Conv.</th><th>Pen.</th><th>Drops</th><th>Pts</th></tr></thead><tbody>${an.map(r=>`<tr><td>${pl(r.j)}</td><td>${r.try}</td><td>${r.conv}</td><td>${r.pen}</td><td>${r.drop}</td><td><b>${r.pts}</b></td></tr>`).join('')}</tbody></table></div>${m.sa!=null&&sum!==m.sa?`<p class="note" style="margin:10px 0 0"><b>Faltan asignar ${m.sa-sum} puntos.</b> Los tantos cargados suman ${sum} y el resultado es ${m.sa}.</p>`:''}</div>`:'',
    `<div class="card"><h3>Ficha del partido</h3><dl class="dl">
      ${hayCap?`<dt>Capitanes</dt><dd>${cap}</dd>`:''}
      ${ama.length?`<dt>Amarillas</dt><dd>${ama.map(e=>pl(e.j)).join(', ')}</dd>`:''}
      ${roja.length?`<dt>Rojas</dt><dd>${roja.map(e=>pl(e.j)).join(', ')}</dd>`:''}
      ${bonus?`<dt>Bonus</dt><dd>${bonus}</dd>`:''}
      ${m.obs?`<dt>Crónica</dt><dd>${m.obs}</dd>`:''}
      <dt>Colores de ${m.rival}</dt><dd>${CLUBES[m.rid].col}</dd>
      <dt>Rival</dt><dd><a href="#rival-${m.rid}">Cómo viene ${m.rival} →</a></dd></dl></div>`].join('');
   const tit=ps.some(p=>p.n&&p.n<=15);
   return `<div class="grid g2"><div class="card"><h3>Titulares</h3>${tit?`<ol class="xv">${XV.map((p,i)=>slot(i+1,p)).join('')}</ol>`:`<p class="empty" style="margin:8px 0 0">${jugado(m)?'Formación no publicada.':'La formación se publica el viernes.'}</p>`}</div>
    <div style="display:flex;flex-direction:column;gap:18px;min-width:0">${col2}</div></div>`})()}
  </section>`;
}

const COLS=[['pj','PJ','Partidos jugados'],['tit','Tit','Titularidades'],['ptit','% Tit','Porcentaje de partidos como titular'],['ban','Banco','Ingresos desde el banco'],['min','Min','Minutos jugados'],['pts','Pts','Puntos'],['try','T','Tries'],['conv','C','Conversiones'],['pen','P','Penales'],['drop','D','Drops'],['ppp','Pts/PJ','Promedio de puntos por partido'],['tpp','T/PJ','Promedio de tries por partido'],['vic','Vic','Victorias en partidos disputados'],['racha','Racha','Fechas consecutivas jugadas'],['ama','TA','Tarjetas amarillas'],['roja','TR','Tarjetas rojas']];
const RANK=[['pj','Más partidos'],['tit','Más titularidades'],['min','Más minutos'],['pts','Más puntos'],['try','Más tries'],['conv','Más conversiones'],['pen','Más penales'],['drop','Más drops'],['ama','Más amarillas'],['roja','Más rojas']];

function statsBody(){
  const rows=calc(S.f);
  const rk=RANK.map(([k,t])=>{const top=rows.filter(r=>r[k]>0).sort((a,b)=>b[k]-a[k]).slice(0,5);
    return `<div class="card rk"><span class="lbl">${t}</span>${top.length?`<ol>${top.map((r,i)=>`<li><span class="i">${i+1}</span><span>${pl(r.id)}</span><span class="v">${r[k]}</span></li>`).join('')}</ol>`:'<p class="empty" style="margin:8px 0 0">Sin registros</p>'}</div>`}).join('');
  // gráfico de puntos por fecha (resultados reales)
  const eq=S.f.eq||'P', ms=PARTIDOS.filter(m=>m.eq===eq&&m.sa!=null&&(!S.f.desde||m.dia>=S.f.desde)&&(!S.f.hasta||m.dia<=S.f.hasta));
  let chart='<p class="empty">Sin resultados cargados en este rango</p>';
  if(ms.length>1){ const W=600,H=230,l=34,r=28,t=14,b=30, mx=Math.ceil(Math.max(...ms.map(m=>Math.max(m.sa,m.ri)))/10)*10;
    const x=i=>l+i*(W-l-r)/(ms.length-1), y=v=>t+(H-t-b)*(1-v/mx), path=k=>ms.map((m,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(m[k]).toFixed(1)).join(' ');
    chart=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Puntos a favor y en contra por fecha">
    ${[0,.5,1].map(q=>`<line class="gl" x1="${l}" x2="${W-r}" y1="${y(mx*q)}" y2="${y(mx*q)}"/><text x="${l-6}" y="${y(mx*q)+4}" text-anchor="end">${mx*q}</text>`).join('')}
    <path class="pc" d="${path('ri')}"/><path class="pf" d="${path('sa')}"/>
    ${ms.map((m,i)=>`<circle class="dpc" cx="${x(i)}" cy="${y(m.ri)}" r="3"><title>F${m.fecha} ${m.rival}: ${m.ri} en contra</title></circle><circle class="dpf" cx="${x(i)}" cy="${y(m.sa)}" r="${i===ms.length-1?5:3.5}"><title>F${m.fecha} ${m.rival}: ${m.sa} a favor</title></circle>${ms.length<=13||i%2===0?`<text x="${x(i)}" y="${H-10}" text-anchor="middle">F${m.fecha}</text>`:''}`).join('')}</svg>
    <div class="leg"><span><i></i>Puntos a favor</span><span><i class="c"></i>Puntos en contra</span></div>`; }
  const bars=(items)=>{const mx=Math.max(1,...items.map(i=>i[1]));return items.length?`<div class="bars">${items.map(([n,v])=>`<div class="bar"><span class="t" title="${n}">${n}</span><span><i style="width:${100*v/mx}%"></i></span><b>${v}</b></div>`).join('')}</div>`:'<p class="empty">Sin registros</p>'};
  const porPos={}; rows.forEach(r=>{if(r.pts){const k=r.j.pos?POS[r.j.pos][0]:'Sin posición';porPos[k]=(porPos[k]||0)+r.pts}});
  const mins=rows.filter(r=>r.min>0).sort((a,b)=>b.min-a.min).slice(0,8).map(r=>[r.j.nombre,r.min]);
  const srt=rows.slice().sort((a,b)=>S.sort==='n'?S.dir*a.j.nombre.localeCompare(b.j.nombre):S.dir*(a[S.sort]-b[S.sort])||b.pj-a.pj);
  const th=(k,l,t)=>`<th ${S.sort===k?`aria-sort="${S.dir<0?'descending':'ascending'}"`:''} title="${t||''}"><button data-sort="${k}">${l}</button></th>`;
  return `<h3 class="sec">Rankings</h3><div class="grid rk5">${rk}</div>
  <h3 class="sec">Gráficos</h3>
  <div class="grid g3">
    <div class="card"><h3>Puntos por fecha · ${EQUIPOS[eq]}</h3><p class="sub" style="margin:2px 0 0">Resultados oficiales de URBA.</p>${chart}</div>
    <div class="card"><h3>Puntos por posición</h3>${bars(Object.entries(porPos).sort((a,b)=>b[1]-a[1]))}</div>
    <div class="card"><h3>Minutos por jugador</h3>${bars(mins)}</div>
  </div>
  <h3 class="sec">Tabla completa</h3><div class="head"><span class="sub">${rows.length} jugadores con participación</span><span class="sub">Tocá un encabezado para ordenar.</span></div>
  <div class="tw"><table><thead><tr>${th('n','Jugador')}<th class="l">Posición</th><th class="l">Equipos</th>${COLS.map(c=>th(...c)).join('')}</tr></thead>
  <tbody>${srt.length?srt.map(r=>`<tr><td>${pl(r.id)}</td><td class="l">${r.j.pos?POS[r.j.pos][0]:'—'}</td><td class="l">${Object.entries(r.eqs).map(([k,v])=>EQUIPOS[k]+' '+v).join(' · ')}</td>${COLS.map(([k])=>`<td>${k==='ptit'?r[k]+'%':k==='ppp'||k==='tpp'?dec(r[k]):k==='min'&&!r.min?'—':r[k]}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${COLS.length+3}" class="l empty">Ningún jugador coincide con los filtros.</td></tr>`}</tbody></table></div>`;
}

const apellido=j=>j.apellido||j.nombre.split(' ').slice(1).join(' ')||j.nombre;
const nombrePila=j=>j.apellido?j.nombre.replace(j.apellido,'').trim():j.nombre.split(' ')[0];
const norm=t=>t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const id2cap=id=>id===TEMPORADA.capitan?' · Capitán':id===TEMPORADA.subcapitan?' · Subcapitán':'';
function plBody(){
  const q=norm(S.plQ.trim()); let js=jugadores().filter(j=>(!S.plPos||j.pos===S.plPos)&&(!q||norm(apellido(j)).includes(q)||norm(j.nombre).includes(q)));
  const card=j=>`<a class="pc" href="#jugador-${j.id}">${FOTOS.has(j.id)?`<img class="av avf" loading="lazy" src="fotos/${j.id}.webp" alt="">`:`<span class="av">${j.demo?'?':ini(j.nombre)}</span>`}<span><b>${j.demo?j.nombre:apellido(j)+', '+nombrePila(j)}</b><small>${j.demo?'Ejemplo · ':''}${posN(j)}${id2cap(j.id)}</small></span></a>`;
  if(!js.length)return '<p class="empty">Ningún jugador coincide con la búsqueda.</p>';
  if(S.plV==='abc'){
    js=js.slice().sort((a,b)=>(a.demo?1:0)-(b.demo?1:0)||norm(apellido(a)).localeCompare(norm(apellido(b)))||a.nombre.localeCompare(b.nombre));
    const g={}; js.forEach(j=>{const k=j.demo?'Fichas de ejemplo':norm(apellido(j))[0].toUpperCase();(g[k]=g[k]||[]).push(j)});
    return Object.entries(g).map(([k,x])=>`<div class="grp"><h3>${k}<small>${x.length}</small></h3><div class="pls">${x.map(card).join('')}</div></div>`).join('');
  }
  const grp=(t,l)=>{const h=Object.entries(POS).filter(([k,v])=>v[1]===l&&(!S.plPos||k===S.plPos)).map(([k,v])=>{const x=js.filter(j=>j.pos===k);return x.length||!q?`<div class="grp"><h3>${v[0]}<small>${x.length||'Sin jugadores cargados'}</small></h3>${x.length?`<div class="pls">${x.map(card).join('')}</div>`:''}</div>`:''}).join('');return h?`<h2 style="font-size:1.5rem;margin-top:6px">${t}</h2>`+h:''};
  const sp=js.filter(j=>!j.pos);
  return (sp.length?`<div class="grp"><h3>Posición a completar<small>${sp.length} · aún sin formación cargada</small></h3><div class="pls">${sp.map(card).join('')}</div></div>`:'')+grp('Forwards','F')+grp('Backs','B');
}
function vPlantel(){
  const o=(v,l,c)=>`<option value="${v}" ${c===v?'selected':''}>${l}</option>`;
  const chip=(v,l)=>`<button class="chip" data-k="plV" data-v="${v}" aria-pressed="${S.plV===v}">${l}</button>`;
  return `<section class="view"><div class="head"><div><h2>Plantel</h2><p>${JUGADORES.length} jugadores reales cargados${S.demo?` y ${DEMO.jug.length} fichas de ejemplo listas para reemplazar`:''}. Tocá un jugador para ver su ficha.</p></div></div>
  <div class="card filters" style="grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) auto">
    <label><span class="lbl">Apellido</span><input type="search" id="p-q" value="${S.plQ}" placeholder="Buscar por apellido o nombre"></label>
    <label><span class="lbl">Posición</span><select id="p-pos">${o('','Todas',S.plPos)}${Object.entries(POS).map(([k,v])=>o(k,v[0],S.plPos)).join('')}</select></label>
    <div><span class="lbl">Ordenar</span><div class="chips" style="margin-top:3px">${chip('pos','Por posición')}${chip('abc','A–Z')}</div></div>
  </div>

const CAMISETA_FIJA={'castellano-francisco':5,'juanuk-gael':7};

}

let DBV=null, UID=null, VOTOS={}, VERR='';
function vVotacion(){

<script>
(()=>{const el=document.getElementById('inst'),go=document.getElementById('inst-go'),steps=document.getElementById('inst-steps');
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true; let cerrado=false;try{cerrado=localStorage.getItem('inst-x')==='1'}catch(e){}
 const ua=navigator.userAgent, ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), movil=ios||/android/i.test(ua);
 let ev=null; addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(!standalone&&!cerrado)el.hidden=false});
 addEventListener('appinstalled',()=>{el.hidden=true});
 if(!standalone&&!cerrado&&movil)el.hidden=false;
 const pasos=l=>{steps.innerHTML=l.map(x=>'<li>'+x+'</li>').join('');steps.hidden=false;go.hidden=true};

 document.getElementById('inst-x').addEventListener('click',()=>{el.hidden=true;try{localStorage.setItem('inst-x','1')}catch(e){}});

 setInterval(()=>{const s=document.createElement('script'),antes=JSON.stringify(window.DATOS);s.src='datos.js?t='+Date.now();s.onload=()=>{s.remove();if(JSON.stringify(window.DATOS)!==antes)location.reload()};s.onerror=()=>s.remove();document.head.appendChild(s)},120000);
 if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
